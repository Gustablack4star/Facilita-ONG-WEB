<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilita ONG - Contato</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    
    <header>
        <nav class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/logo-facilita-ong.png" alt="Logo da Facilita ONG" class="header-logo">
            </a>
            
            <button class="menu-toggle" aria-controls="main-menu" aria-expanded="false">
                &#9776; 
            </button>
            
            <ul id="main-menu" role="menubar">
                <li role="none"><a href="index.html" role="menuitem">Início</a></li>
                
                <li class="dropdown" role="none">
                    <a href="#" role="menuitem" aria-haspopup="true" aria-expanded="false">
                        Causas <span class="arrow">&#9662;</span> 
                    </a>
                    <ul class="dropdown-menu" role="menu">
                        <li role="none"><a href="projetos.html" role="menuitem">Projetos Atuais</a></li>
                        <li role="none"><a href="voluntariado.html" role="menuitem">Voluntariado</a></li>
                        <li role="none"><a href="doacoes.html" role="menuitem">Como Doar</a></li>
                    </ul>
                </li>
                
                <li role="none"><a href="sobre.html" role="menuitem">Sobre Nós</a></li>
                <li role="none"><a href="contato.html" role="menuitem">Contato</a></li>
                <li role="none"><a href="cadastro.html" role="menuitem" class="cta-button primary">Cadastre-se</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="contato-info" class="container section-padding" aria-labelledby="contato-titulo">
            <h1 id="contato-titulo" class="text-center">Fale Conosco</h1>
            <p class="text-center">Envie suas dúvidas, sugestões ou pedidos de informação através do formulário abaixo.</p>
            
            <form action="#" method="POST" style="max-width: 600px; margin: var(--espaco-xl) auto;">
                <div class="field-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="inline-fields" style="margin-top: var(--espaco-md);">
                    <div class="field-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="field-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone">
                    </div>
                </div>

                <div class="field-group" style="margin-top: var(--espaco-md);">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto" required>
                        <option value="" disabled selected>Selecione um assunto</option>
                        <option value="doacao">Dúvidas sobre Doações</option>
                        <option value="voluntariado">Oportunidades de Voluntariado</option>
                        <option value="geral">Informações Gerais</option>
                    </select>
                </div>

                <div class="field-group" style="margin-top: var(--espaco-md);">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required style="width: 100%; padding: var(--espaco-sm); border: 1px solid var(--cor-neutra-borda); border-radius: var(--raio-borda);"></textarea>
                </div>

                <button type="submit" class="cta-button primary" style="width: 100%; margin-top: var(--espaco-md);">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Facilita ONG. Todos os direitos reservados. | <a href="contato.html">Política de Privacidade</a></p>
        </div>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const mainMenu = document.getElementById('main-menu');
            const dropdowns = document.querySelectorAll('.dropdown > a');

            menuToggle.addEventListener('click', function() {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true' || false;
                menuToggle.setAttribute('aria-expanded', !isExpanded);
                mainMenu.classList.toggle('active');
            });

            dropdowns.forEach(dropdown => {
                dropdown.addEventListener('click', function(e) {
                    if (window.innerWidth < 768) { 
                        e.preventDefault(); 
                        const parentLi = this.closest('.dropdown');
                        parentLi.classList.toggle('active');
                        this.setAttribute('aria-expanded', parentLi.classList.contains('active'));
                    }
                });
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    mainMenu.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    document.querySelectorAll('.dropdown.active').forEach(d => d.classList.remove('active'));
                }
            });
        });
    </script>
</body>
</html>
