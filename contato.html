<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transformando Vidas | Facilita ONG</title> 
    <meta name="description" content="A plataforma oficial da ONG, conheça nosso trabalho, saiba como ser voluntário ou seja um doador.">

    <link rel="stylesheet" href="css/style.css">
</head>
<main id="main-content">
    <section id="contato-info" aria-labelledby="contato-titulo">
        <h1 id="contato-titulo">Fale Conosco</h1>
        <p>Tem dúvidas, sugestões ou interesse em parcerias? Entre em contato!</p>

        <address class="contact-details">
            <p><strong>Endereço:</strong> Rua Pilar do Sul 16, São Paulo, SP</p>
            <p><strong>Telefone:</strong> <a href="tel:+5511999999999">(11) 99999-9999</a></p>
            <p><strong>E-mail:</strong> <a href="mailto:contato@facilitaong.org">contato@facilitaong.org</a></p>
        </address>

        <div class="contact-form-wrapper">
            <h2>Envie uma Mensagem Rápida</h2>
            <form action="#" method="POST" class="contact-form">
                
                <label for="nome_contato">Seu Nome:</label>
                <input type="text" id="nome_contato" name="nome_contato" required>

                <label for="email_contato">Seu E-mail:</label>
                <input type="email" id="email_contato" name="email_contato" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit" class="cta-button primary">Enviar Mensagem</button>
            </form>
        </div>
    </section>
</main>
