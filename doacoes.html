<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transformando Vidas | Facilita ONG</title> 
    <meta name="description" content="A plataforma oficial da ONG, conheça nosso trabalho, saiba como ser voluntário ou seja um doador.">

    <link rel="stylesheet" href="css/style.css">
</head><main id="main-content">
    <section id="captação-recursos" aria-labelledby="doacao-titulo">
        <h1 id="doacao-titulo">Faça a Diferença: Doe Agora!</h1>
        <p>Cada contribuição nos ajuda a alcançar mais pessoas. Acompanhe nossa meta em tempo real.</p>
        
        <div class="progress-container">
            <h3>Campanha: Educação para o Futuro</h3>
            <div class="progress-bar-base">
                <div class="progress-bar-fill" style="width: 75%;"></div> 
            </div>
            <p class="progress-info">R$ 5.500 arrecadados (Meta: R$ 10.000)</p>
        </div>

        <div class="donation-form-wrapper">
            <h2>Escolha seu Valor:</h2>
            <form action="#" method="POST" class="donation-form">
                <div class="donation-options">
                    <label><input type="radio" name="valor" value="25" required> R$ 25</label>
                    <label><input type="radio" name="valor" value="50"> R$ 50</label>
                    <label><input type="radio" name="valor" value="100"> R$ 100</label>
                    <label>Outro: <input type="number" name="outro_valor" min="10" placeholder="R$"></label>
                </div>
                
                <label for="nome">Nome Completo (Opcional):</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail (Requisito para Transparência):</label>
                <input type="email" id="email" name="email" required>

                <button type="submit" class="cta-button primary">Confirmar Doação</button>
                <p class="small-print">Suas informações estão seguras. Aceitamos Pix e Cartão (simulação).</p>
            </form>
        </div>
    </section>
</main>
